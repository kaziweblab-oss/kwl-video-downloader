name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CI: true

jobs:
  validate:
    name: Validate (tests + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run check

  windows:
    name: Windows (.exe + .msi)
    needs: validate
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release bundles (NSIS + MSI)
        run: |
          npm run build --workspace @kwl/desktop
          npx tauri build --bundles nsis msi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

  linux:
    name: Linux (.deb + .AppImage)
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release bundles (Deb + AppImage)
        run: |
          npm run build --workspace @kwl/desktop
          npx tauri build --bundles deb appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  macos:
    name: macOS (.dmg)
    needs: validate
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release bundles (.dmg)
        run: |
          npm run build --workspace @kwl/desktop
          npx tauri build --bundles dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  android:
    name: Android (.apk)
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Rust Android toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Init Android project
        run: npx tauri android init

      - name: Stage bundled native tools into the generated Android project
        run: |
          for tool in yt-dlp ffmpeg ffprobe; do
            if compgen -G "apps/desktop/src-tauri/android/app/src/main/assets/native_tools/$tool*" > /dev/null; then
              mkdir -p apps/desktop/src-tauri/gen/android/app/src/main/assets/native_tools
              cp apps/desktop/src-tauri/android/app/src/main/assets/native_tools/$tool* apps/desktop/src-tauri/gen/android/app/src/main/assets/native_tools/
              chmod 755 apps/desktop/src-tauri/gen/android/app/src/main/assets/native_tools/$tool*
            fi
          done
          find apps/desktop/src-tauri/gen/android/app/src/main/assets -maxdepth 3 -type f 2>/dev/null | sort

      - name: Ensure Android permissions in the generated manifest
        run: |
          MANIFEST=apps/desktop/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          if [ ! -f "$MANIFEST" ]; then
            MANIFEST=apps/desktop/src-tauri/android/app/src/main/AndroidManifest.xml
          fi
          for perm in android.permission.INTERNET android.permission.READ_EXTERNAL_STORAGE android.permission.WRITE_EXTERNAL_STORAGE; do
            grep -q "name=\"$perm\"" "$MANIFEST" || sed -i "s#</manifest>#    <uses-permission android:name=\"$perm\" />\n</manifest>#" "$MANIFEST"
          done
          grep -n "uses-permission" "$MANIFEST"

      - name: Build Android APK
        run: npx tauri android build --apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/desktop/src-tauri/android/app/build/outputs/apk/**/*.apk

  release:
    name: Publish GitHub Release
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
          body: |
            ## KWL Video Downloader v1.0.0

            The first production release of **KWL Video Downloader** - completely free, offline, and cross-platform.

            ### What's included
            - Download video and audio with real-time progress
            - Concurrent download queue with pause / resume / cancel
            - Automatic history management
            - 3GP output with FFmpeg transcode
            - Built-in runtime tool management (yt-dlp / FFmpeg / ffprobe)
            - In-app report center (report an error, suggestion, or feedback)
            - English and Bangla language support

            ### Installers
            - Windows: NSIS `.exe` + MSI `.msi`
            - Android: `.apk`
            - macOS: `.dmg`
            - Linux: `.deb` + `.AppImage`

            ### Notes
            - No account, login, license, or payment required
            - KWL Nexus (cloud account, plans, licensing) ships in a future release
name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CI: true

jobs:
  validate:
    name: Validate (tests + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run check

  windows:
    name: Windows (.exe + .msi)
    needs: validate
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release bundles (NSIS + MSI)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run build --workspace @kwl/desktop
          npx tauri build --bundles nsis msi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig
            apps/desktop/src-tauri/target/release/bundle/**/*.json

  linux:
    name: Linux (.deb + .AppImage)
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgirepository1.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release bundles (Deb + AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run build --workspace @kwl/desktop
          npx tauri build --bundles deb appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.sig
            apps/desktop/src-tauri/target/release/bundle/**/*.json

  macos:
    name: macOS (.dmg)
    needs: validate
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release bundles (.dmg)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run build --workspace @kwl/desktop
          npx tauri build --bundles dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.sig
            apps/desktop/src-tauri/target/release/bundle/**/*.json

  android:
    name: Android (.apk)
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Rust Android toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Init Android project
        run: npx tauri android init

      - name: Patch APK output name to kwl-video-downloader-{version}.apk
        run: |
          python3 << 'PY'
          import pathlib
          for p in ["apps/desktop/src-tauri/gen/android/app/build.gradle.kts", "apps/android/src-tauri/gen/android/app/build.gradle.kts"]:
              fp = pathlib.Path(p)
              if not fp.exists():
                  print(f"skip missing {p}")
                  continue
              text = fp.read_text(encoding="utf-8")
              if "kwl-video-downloader" in text:
                  print(f"already patched {p}")
                  continue
              old = "    buildFeatures {\n        buildConfig = true\n    }\n}"
              new = """    buildFeatures {
                  buildConfig = true
              }

              // Permanent APK name: kwl-video-downloader-{versionName}.apk (fallback 1.0.3)
              applicationVariants.all {
                  val variant = this
                  outputs.all {
                      val output = this as com.android.build.gradle.internal.api.BaseVariantOutputImpl
                      val ver = variant.versionName.ifEmpty { "1.0.3" }
                      output.outputFileName = "kwl-video-downloader-${ver}.apk"
                  }
              }
          }"""
              if old in text:
                  text = text.replace(old, new)
                  fp.write_text(text, encoding="utf-8")
                  print(f"patched {p}")
              else:
                  print(f"marker not found in {p}")
                  if "applicationVariants.all" not in text:
                      import re
                      m = re.search(r"(buildFeatures\s*\{\s*buildConfig\s*=\s*true\s*\})", text)
                      if m:
                          insert = m.group(1) + "\n\n    // Permanent APK name\n    applicationVariants.all {\n        val variant = this\n        outputs.all {\n            val output = this as com.android.build.gradle.internal.api.BaseVariantOutputImpl\n            val ver = variant.versionName.ifEmpty { \"1.0.3\" }\n            output.outputFileName = \"kwl-video-downloader-${ver}.apk\"\n        }\n    }"
                          text = text.replace(m.group(1), insert, 1)
                          fp.write_text(text, encoding="utf-8")
                          print(f"fallback patched {p}")
          PY
          echo "Patched build.gradle.kts files:"
          grep -n "kwl-video-downloader" apps/desktop/src-tauri/gen/android/app/build.gradle.kts apps/android/src-tauri/gen/android/app/build.gradle.kts 2>/dev/null || echo "no gen files yet (will be patched on local builds)"

      - name: Stage bundled native tools into the generated Android project
        run: |
          for tool in yt-dlp ffmpeg ffprobe; do
            if compgen -G "apps/desktop/src-tauri/android/app/src/main/assets/native_tools/$tool*" > /dev/null; then
              mkdir -p apps/desktop/src-tauri/gen/android/app/src/main/assets/native_tools
              cp apps/desktop/src-tauri/android/app/src/main/assets/native_tools/$tool* apps/desktop/src-tauri/gen/android/app/src/main/assets/native_tools/
              chmod 755 apps/desktop/src-tauri/gen/android/app/src/main/assets/native_tools/$tool*
            fi
          done
          find apps/desktop/src-tauri/gen/android/app/src/main/assets -maxdepth 3 -type f 2>/dev/null | sort

      - name: Ensure Android permissions in the generated manifest
        run: |
          MANIFEST=apps/desktop/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          if [ ! -f "$MANIFEST" ]; then
            MANIFEST=apps/desktop/src-tauri/android/app/src/main/AndroidManifest.xml
          fi
          for perm in android.permission.INTERNET android.permission.READ_EXTERNAL_STORAGE android.permission.WRITE_EXTERNAL_STORAGE; do
            grep -q "name=\"$perm\"" "$MANIFEST" || sed -i "s#</manifest>#    <uses-permission android:name=\"$perm\" />\n</manifest>#" "$MANIFEST"
          done
          grep -n "uses-permission" "$MANIFEST"

      - name: Build Android APK
        run: npx tauri android build --apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/desktop/src-tauri/android/app/build/outputs/apk/**/*.apk
            apps/android/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/android/src-tauri/gen/android/app/build/outputs/apk/**/kwl-video-downloader-*.apk

  release:
    name: Publish GitHub Release
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show collected artifacts
        run: |
          echo "Collected artifacts for ${{ github.ref_name }}:"
          find artifacts -type f | sort

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          make_latest: true
          fail_on_unmatched_files: false
          files: artifacts/**/*
          body: |
            ## KWL Video Downloader ${{ github.ref_name }}

            **KWL Video Downloader** — free, offline, and cross-platform.

            ### What's included
            - Download video and audio with real-time progress
            - Concurrent download queue with pause / resume / cancel
            - Automatic history management
            - 3GP output with FFmpeg transcode
            - Built-in runtime tool management (yt-dlp / FFmpeg / ffprobe)
            - In-app report center
            - English and Bangla language support

            ### Installers (${{ github.ref_name }})
            - Windows: NSIS `.exe` + MSI `.msi`
            - Android: `.apk`
            - macOS: `.dmg`
            - Linux: `.deb` + `.AppImage`

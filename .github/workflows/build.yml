name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CI: true

jobs:
  validate:
    name: Validate (tests + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run check

  windows:
    name: Windows (.exe + .msi)
    needs: validate
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release bundles (NSIS + MSI)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run build --workspace @kwl/desktop
          cd apps/desktop && npx tauri build --bundles nsis msi

      - name: List bundle outputs
        shell: bash
        run: find target/release/bundle -type f | sort

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
            target/release/bundle/**/*.json

  linux:
    name: Linux (.deb + .AppImage)
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgirepository1.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release bundles (Deb + AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run build --workspace @kwl/linux
          cd apps/linux && npx tauri build --bundles deb appimage

      - name: List bundle outputs
        run: find target/release/bundle -type f | sort

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/**/*.sig
            target/release/bundle/**/*.json

  macos:
    name: macOS (.dmg)
    needs: validate
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release bundles (.dmg)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run build --workspace @kwl/macos
          cd apps/macos && npx tauri build --bundles dmg

      - name: List bundle outputs
        run: find target/release/bundle -type f | sort

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz
            target/release/bundle/**/*.sig
            target/release/bundle/**/*.json

  android:
    name: Android (.apk)
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (manual — setup-android@v3 requests the removed legacy `tools` package and fails)
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          if [ -d "$SDK/cmdline-tools/latest" ]; then CT="$SDK/cmdline-tools/latest/bin";
          else CT="$(ls -d $SDK/cmdline-tools/*/bin 2>/dev/null | head -n1)"; fi
          export PATH="$CT:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"
          NDK="$(ls -d $SDK/ndk/* 2>/dev/null | head -n1)"
          if [ -n "$NDK" ]; then echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV; echo "NDK_HOME=$NDK" >> $GITHUB_ENV; fi

      - name: Rust Android toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/android/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Init Android project
        run: cd apps/android && npx tauri android init --ci

      - name: Patch APK output name to KWL Video Downloader-{version}.apk
        run: |
          python3 << 'PY'
          import pathlib
          for p in ["apps/desktop/src-tauri/gen/android/app/build.gradle.kts", "apps/android/src-tauri/gen/android/app/build.gradle.kts"]:
              fp = pathlib.Path(p)
              if not fp.exists():
                  print(f"skip missing {p}")
                  continue
              text = fp.read_text(encoding="utf-8")
              if "KWL Video Downloader" in text:
                  print(f"already patched {p}")
                  continue
              old = "    buildFeatures {\n        buildConfig = true\n    }\n}"
              new = """    buildFeatures {
                  buildConfig = true
              }

              // Permanent APK name: KWL Video Downloader-{versionName}.apk (fallback 1.0.10)
              applicationVariants.all {
                  val variant = this
                  outputs.all {
                      val output = this as com.android.build.gradle.internal.api.BaseVariantOutputImpl
                      val ver = variant.versionName.ifEmpty { "1.0.10" }
                      output.outputFileName = "KWL Video Downloader-${ver}.apk"
                  }
              }
          }"""
              if old in text:
                  text = text.replace(old, new)
                  fp.write_text(text, encoding="utf-8")
                  print(f"patched {p}")
              else:
                  print(f"marker not found in {p}")
                  if "applicationVariants.all" not in text:
                      import re
                      m = re.search(r"(buildFeatures\s*\{\s*buildConfig\s*=\s*true\s*\})", text)
                      if m:
                          insert = m.group(1) + "\n\n    // Permanent APK name\n    applicationVariants.all {\n        val variant = this\n        outputs.all {\n            val output = this as com.android.build.gradle.internal.api.BaseVariantOutputImpl\n            val ver = variant.versionName.ifEmpty { \"1.0.10\" }\n            output.outputFileName = \"KWL Video Downloader-${ver}.apk\"\n        }\n    }"
                          text = text.replace(m.group(1), insert, 1)
                          fp.write_text(text, encoding="utf-8")
                          print(f"fallback patched {p}")
          PY
          echo "Patched build.gradle.kts files:"
          grep -n "KWL Video Downloader" apps/desktop/src-tauri/gen/android/app/build.gradle.kts apps/android/src-tauri/gen/android/app/build.gradle.kts 2>/dev/null || echo "no gen files yet (will be patched on local builds)"

      - name: Stage bundled native tools into the generated Android project
        run: |
          for tool in yt-dlp ffmpeg ffprobe; do
            if compgen -G "apps/desktop/src-tauri/android/app/src/main/assets/native_tools/$tool*" > /dev/null; then
              mkdir -p apps/android/src-tauri/gen/android/app/src/main/assets/native_tools
              cp apps/desktop/src-tauri/android/app/src/main/assets/native_tools/$tool* apps/android/src-tauri/gen/android/app/src/main/assets/native_tools/
              chmod 755 apps/android/src-tauri/gen/android/app/src/main/assets/native_tools/$tool*
            fi
          done
          find apps/android/src-tauri/gen/android/app/src/main/assets -maxdepth 3 -type f 2>/dev/null | sort

      - name: Ensure Android permissions in the generated manifest
        run: |
          MANIFEST=apps/android/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found — 'tauri android init' did not generate apps/android/src-tauri/gen/android" >&2
            exit 1
          fi
          for perm in android.permission.INTERNET android.permission.READ_EXTERNAL_STORAGE android.permission.WRITE_EXTERNAL_STORAGE; do
            grep -q "name=\"$perm\"" "$MANIFEST" || sed -i "s#</manifest>#    <uses-permission android:name=\"$perm\" />\n</manifest>#" "$MANIFEST"
          done
          grep -n "uses-permission" "$MANIFEST"

      - name: Dump generated Android launcher icons (fail if adaptive icon missing)
        run: |
          RES=apps/android/src-tauri/gen/android/app/src/main/res
          find "$RES" -maxdepth 2 | sort
          test -f "$RES/drawable-v24/ic_launcher_foreground.xml" || { echo "ERROR: adaptive ic_launcher_foreground.xml missing from generated res" >&2; exit 1; }
          test -f "$RES/drawable/ic_launcher_background.xml" || { echo "ERROR: ic_launcher_background.xml missing from generated res" >&2; exit 1; }
          echo "--- adaptive foreground ---"
          cat "$RES/drawable-v24/ic_launcher_foreground.xml"
          echo "--- adaptive background (must be brand dark, not white) ---"
          cat "$RES/drawable/ic_launcher_background.xml"

      - name: Setup Android signing (persistent keystore via secrets when present, else throwaway CI debug key)
        env:
          KWL_ANDROID_KEYSTORE_BASE64: ${{ secrets.KWL_ANDROID_KEYSTORE_BASE64 }}
          KWL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KWL_ANDROID_KEYSTORE_PASSWORD }}
          KWL_ANDROID_KEY_ALIAS: ${{ secrets.KWL_ANDROID_KEY_ALIAS }}
          KWL_ANDROID_KEY_PASSWORD: ${{ secrets.KWL_ANDROID_KEY_PASSWORD }}
        run: |
          GEN=apps/android/src-tauri/gen/android
          if [ -n "$KWL_ANDROID_KEYSTORE_BASE64" ]; then
            echo "$KWL_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kwl-release.keystore"
            ALIAS="${KWL_ANDROID_KEY_ALIAS:-kwlrelease}"
            KP="${KWL_ANDROID_KEY_PASSWORD:-$KWL_ANDROID_KEYSTORE_PASSWORD}"
            printf 'keyAlias=%s\npassword=%s\nkeyPassword=%s\nstoreFile=%s/kwl-release.keystore\n' "$ALIAS" "$KWL_ANDROID_KEYSTORE_PASSWORD" "$KP" "$RUNNER_TEMP" > "$GEN/keystore.properties"
            echo "keystore.properties written (persistent release key from secrets)"
          else
            keytool -genkey -v -keystore "$RUNNER_TEMP/kwl-debug.keystore" -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias kwldebug -storepass android -keypass android -dname "CN=KWL, OU=KWL Video Downloader, O=KWL, L=Dhaka, C=BD"
            printf 'keyAlias=kwldebug\npassword=android\nkeyPassword=android\nstoreFile=%s/kwl-debug.keystore\n' "$RUNNER_TEMP" > "$GEN/keystore.properties"
            echo "keystore.properties written (throwaway debug key, device-installable; updates across releases need the persistent secret)"
          fi

      - name: Patch APK signing config into generated build.gradle.kts
        run: |
          python3 << 'PY'
          import pathlib, re, sys
          p = pathlib.Path("apps/android/src-tauri/gen/android/app/build.gradle.kts")
          if not p.exists():
              print("ERROR: build.gradle.kts not found — 'tauri android init' did not generate apps/android/src-tauri/gen/android", file=sys.stderr)
              sys.exit(1)
          text = p.read_text(encoding="utf-8")
          # Kotlin DSL shadows `java.*` with the Java plugin extension, so
          # fully-qualified java.util/java.io references do NOT compile.
          # Import once at the top and use simple names + getProperty().
          for imp in ("import java.io.FileInputStream", "import java.util.Properties"):
              if imp not in text:
                  text = imp + "\n" + text
                  print(f"added {imp}")
          if "keystore.properties" not in text:
              block = """    signingConfigs {
                  create("release") {
                      val keystorePropertiesFile = rootProject.file("keystore.properties")
                      val keystoreProperties = Properties()
                      if (keystorePropertiesFile.exists()) {
                          FileInputStream(keystorePropertiesFile).use { keystoreProperties.load(it) }
                      }
                      keyAlias = keystoreProperties.getProperty("keyAlias", "")
                      keyPassword = keystoreProperties.getProperty("keyPassword", keystoreProperties.getProperty("password", ""))
                      storeFile = file(keystoreProperties.getProperty("storeFile", ""))
                      storePassword = keystoreProperties.getProperty("password", "")
                  }
              }

          """
              m = re.search(r"buildTypes\s*\{", text)
              if not m:
                  print("ERROR: no buildTypes block in build.gradle.kts", file=sys.stderr)
                  sys.exit(1)
              text = text[:m.start()] + block + text[m.start():]
              print("signingConfigs block inserted")
          else:
              print("signingConfigs already present")
          if "signingConfigs.getByName(\"release\")" not in text:
              m2 = re.search(r"(getByName\(\"release\"\)\s*\{)", text)
              if not m2:
                  print("ERROR: no getByName(\"release\") block in build.gradle.kts", file=sys.stderr)
                  sys.exit(1)
              text = text.replace(m2.group(1), m2.group(1) + "\n                    signingConfig = signingConfigs.getByName(\"release\")", 1)
              print("release signingConfig wired")
          else:
              print("release signingConfig already wired")
          p.write_text(text, encoding="utf-8")
          PY

      - name: Patch core library desugaring into generated build.gradle.kts
        run: |
          python3 << 'PY'
          import pathlib, re, sys
          p = pathlib.Path("apps/android/src-tauri/gen/android/app/build.gradle.kts")
          if not p.exists():
              print("ERROR: build.gradle.kts not found — 'tauri android init' did not generate apps/android/src-tauri/gen/android", file=sys.stderr)
              sys.exit(1)
          text = p.read_text(encoding="utf-8")
          # Java 8+ bytecode in Tauri/plugin AARs references java.lang.BootstrapMethodError,
          # which does not exist below API 26 -> NoClassDefFoundError crash on Android 7.x.
          # Core library desugaring backports it; minSdk 24 stays.
          if "isCoreLibraryDesugaringEnabled" not in text:
              m = re.search(r"^([ \t]*)kotlinOptions\s*\{\s*$", text, re.M)
              if not m:
                  print("ERROR: no kotlinOptions block in build.gradle.kts; file content:", file=sys.stderr)
                  print(text, file=sys.stderr)
                  sys.exit(1)
              indent = m.group(1)
              block = f"{indent}compileOptions {{\n{indent}    isCoreLibraryDesugaringEnabled = true\n{indent}}}\n\n"
              text = text[:m.start()] + block + text[m.start():]
              print("core library desugaring enabled")
          else:
              print("core library desugaring already enabled")
          if "desugar_jdk_libs" not in text:
              d = re.search(r"^([ \t]*)dependencies\s*\{\s*$", text, re.M)
              if not d:
                  print("ERROR: no dependencies block in build.gradle.kts; file content:", file=sys.stderr)
                  print(text, file=sys.stderr)
                  sys.exit(1)
              indent = d.group(1) + "    "
              text = text[:d.end()] + f'\n{indent}coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")' + text[d.end():]
              print("desugar_jdk_libs dependency added")
          else:
              print("desugar_jdk_libs already present")
          p.write_text(text, encoding="utf-8")
          print("--- patched regions ---")
          for line in text.splitlines():
              if "esugaring" in line or "compileOptions" in line:
                  print("  " + line.strip())

      - name: Build Android APK
        run: cd apps/android && npx tauri android build --apk

      - name: List APK outputs
        run: find apps/android/src-tauri/gen/android/app/build/outputs -type f -name '*.apk' 2>/dev/null | sort

      - name: Verify APK signature and manifest (fail on unsigned/corrupt output)
        run: |
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$ANDROID_HOME/build-tools/33.0.0:$PATH"
          APK=$(find apps/android/src-tauri/gen/android/app/build/outputs -type f -name 'KWL Video Downloader-*.apk' | sort | head -n1)
          if [ -z "$APK" ]; then
            echo "ERROR: no KWL Video Downloader-*.apk found" >&2
            find apps/android/src-tauri/gen/android/app/build/outputs -type f | sort
            exit 1
          fi
          echo "Verifying $APK"
          apksigner verify --print-certs "$APK"
          aapt dump badging "$APK" | grep -E "^(package|application|launchable-activity)" || true
          echo "--- packaged icons + native libs ---"
          unzip -l "$APK" | grep -iE "mipmap|lib/.*\.so" | sort
          ls -la "$APK"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: |
            apps/android/src-tauri/gen/android/app/build/outputs/apk/**/KWL Video Downloader-*.apk

  release:
    name: Publish GitHub Release
    # Android SDK + build fixed (manual SDK setup, tauri npm script) — full set ships together.
    needs: [windows, linux, macos, android]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show collected artifacts
        run: |
          echo "Collected artifacts for ${{ github.ref_name }}:"
          find artifacts -type f | sort

      - name: Generate updater latest.json
        run: python3 scripts/generate-latest-json.py ${{ github.ref_name }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*
            latest.json
          body: |
            ## KWL Video Downloader ${{ github.ref_name }}

            **KWL Video Downloader** — free, offline, and cross-platform.

            ### What's included
            - Download video and audio with real-time progress
            - Concurrent download queue with pause / resume / cancel
            - Automatic history management
            - 3GP output with FFmpeg transcode
            - Built-in runtime tool management (yt-dlp / FFmpeg / ffprobe)
            - In-app report center
            - English and Bangla language support

            ### Installers (${{ github.ref_name }})
            - Windows: NSIS `.exe` + MSI `.msi`
            - Android: `.apk`
            - macOS: `.dmg`
            - Linux: `.deb` + `.AppImage`
